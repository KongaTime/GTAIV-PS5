name: Host checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tests/run_host_tests.py
      - name: Profiles, paths and controller mapping
        working-directory: prospero-win
        run: |
          make build/host/test_pw_wine_cwd build/host/test_pw_game_profile build/host/test_pw_wine_display
          build/host/test_pw_wine_cwd
          build/host/test_pw_game_profile
          build/host/test_pw_wine_display
